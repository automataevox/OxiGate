[package]
name = "oxigate"
version = "0.1.0"
edition = "2021"
authors = ["OxiGate Contributors"]
description = "Ultra-fast, memory-safe L7 HTTP/HTTPS reverse proxy and load balancer written in pure Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/oxigate"
keywords = ["proxy", "load-balancer", "reverse-proxy", "http", "tokio"]
categories = ["network-programming", "web-programming"]
readme = "README.md"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }

# HTTP (hyper 1.x)
hyper = { version = "1.3", features = ["full"] }
hyper-util = { version = "0.1.3", features = ["full"] }
http-body-util = "0.1"
http-body = "1"
http = "1"
bytes = "1"

# TLS termination (versions compatible with Rust 1.75)
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
webpki-roots = "0.26"
hyper-rustls = { version = "0.27", features = ["http1", "http2", "native-tokio", "tls12"] }


# Lock-free config swap
arc-swap = "1.6"

# Serialization / Config
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
futures = "0.3"
futures-util = "0.3"
parking_lot = "0.12"
dashmap = "5.5"
socket2 = "0.5"
pin-project-lite = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.27"


[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
